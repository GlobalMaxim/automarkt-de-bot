version: '3.6'
services:
  app:
    build: .
    container_name: aiogram_app
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - automarkt-network
  db:
    container_name: 'postgres-automarkt'
    image: 'postgres:14'
    restart: always
    ports:
      - "5432:5432"
    environment:
        POSTGRES_DB: automarkt_bot
        POSTGRES_PASSWORD: qwerty1998
        POSTGRES_USER: maxim
        # HOSTNAME: localhost
    volumes:
      - './docker/db:/var/lib/postgresql/data'
    networks:
      - automarkt-network
  redis:
    container_name: 'redis-automarkt'
    image: 'redis:latest'
    restart: always
    command: redis-server --loglevel warning
    environment: 
      - ALLOW_EMPTY_PASSWORD=Yes
    ports:
      - 6379:6379
    volumes:
      - './docker/redis:/usr/local/etc/redis/redis.conf'
      - './docker/redis/data:/data'
    networks:
      - automarkt-network
networks:
  automarkt-network:  # Создание сети
    driver: bridge
